name: Build TWRP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space & Install Dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift /usr/lib/llvm-* /usr/local/lib/node_modules
          sudo apt-get update
          # Устанавливаем repo официально через apt, чтобы никаких curl и битых html не было!
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc rsync repo

      - name: Initialize and Sync TWRP Manifest
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "Linzixrxq"
          git config --global user.email "builder@example.com"
          # Используем системный repo и правильную ссылку на манифест
          repo init -u https://github.com -b twrp-12.1 --depth=1
          repo sync -c -q --no-tags --no-clone-bundle -j$(nproc)

      - name: Copy Device Tree
        run: |
          mkdir -p workspace/device/xiaomi/frost
          rsync -av --exclude='workspace' --exclude='.git' --exclude='.github' ./ workspace/device/xiaomi/frost/

      # Скачивание твоего ядра из Catbox
      - name: Download Heavy Prebuilt Kernel from Catbox
        run: |
          mkdir -p workspace/device/xiaomi/frost/prebuilt
          curl -L -o workspace/device/xiaomi/frost/prebuilt/kernel "https://catbox.moe"

      - name: Build TWRP (Boot Image)
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_frost-eng
          mka bootimage -j$(nproc)

      - name: Check Built Images
        run: |
          echo "=== Показываю скомпилированные файлы ==="
          ls -la workspace/out/target/product/frost/ || true

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Poco-C40-boot
          path: workspace/out/target/product/frost/boot.img
          if-no-files-found: error
